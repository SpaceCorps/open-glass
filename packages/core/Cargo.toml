[package]
name = "open-glass-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apple Glass optical physics core (Rust/WebAssembly) for the web"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "GpuDevice",
  "GpuQueue",
  "GpuRenderPipeline",
  "GpuTexture",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlFramebuffer",
  "WebGlBuffer",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "Window",
  "Document",
  "console",
] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.21", features = ["derive"] }
console_error_panic_hook = "0.1"

# Target-gated so a host `cargo build` / `cargo test` never pulls it in: only the wasm32 target can
# run `tests/webgl2_browser.rs`, which needs a real browser with a WebGL2 driver.
#
# The extra web-sys feature is for the pixel tests only: they paint a non-uniform backdrop with a 2D
# canvas context before uploading it, which the renderer itself never needs.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d"] }

# Target-gated the other way from the block above: only a host `cargo test` can run
# `tests/wgsl_shaders.rs`, and gating keeps `wasm-pack test` from building a shader compiler for
# wasm32 to run a file that is `#![cfg(not(target_arch = "wasm32"))]` anyway.
#
# Dev-dependencies are never linked into the `cdylib`, so this adds nothing to the wasm bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
